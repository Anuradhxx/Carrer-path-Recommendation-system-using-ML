<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Tag Quiz — Admin</title>
    <style>
        body { font-family: 'Inter', sans-serif; background: #0b1220; color: #e5e7eb; margin: 0; padding: 40px 24px; }
        .container { max-width: 600px; margin: 0 auto; }
        h1 { font-size: 22px; margin-bottom: 8px; }
        p { color: #64748b; margin-bottom: 32px; font-size: 14px; }
        label { display: block; font-size: 13px; color: #94a3b8; margin-bottom: 8px; font-weight: 600; }
        input[type="text"] {
            width: 100%; padding: 12px 16px;
            background: #111827; border: 1px solid #1f2937;
            border-radius: 10px; color: #fff; font-size: 14px; margin-bottom: 24px;
        }
        button {
            background: linear-gradient(135deg, #22d3ee, #818cf8);
            color: #0a0f1e; border: none; padding: 12px 28px;
            border-radius: 10px; font-weight: 700; font-size: 14px; cursor: pointer;
        }
        .hint {
            background: rgba(34,211,238,0.07);
            border: 1px solid rgba(34,211,238,0.2);
            border-radius: 10px; padding: 14px 16px;
            font-size: 13px; color: #67e8f9; margin-bottom: 28px; line-height: 1.6;
        }
        a { color: #64748b; font-size: 13px; text-decoration: none; display: inline-block; margin-top: 16px; }
        a:hover { color: #e5e7eb; }
    </style>
</head>
<body>
<div class="container">
    <h1>Tag Quiz: "{{ quiz_title }}"</h1>
    <p>Tags help the recommendation engine match this quiz to relevant careers.</p>

    <div class="hint">
        💡 Enter comma-separated lowercase keywords that describe what this quiz tests.<br>
        <strong>Examples:</strong> <code>python, data science, machine learning</code> or <code>javascript, frontend, web</code>
    </div>

    <form method="POST">
        <label>Tags (comma-separated)</label>
        <input type="text" name="tags" value="{{ existing_tags }}" 
               placeholder="e.g. python, machine learning, data science">
        <button type="submit">Save Tags</button>
    </form>

    <a href="/quiz_list">← Back to Quiz List</a>
</div>
</body>
</html>
