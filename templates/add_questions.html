<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<title>Add Question</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>

body{
    margin:0;
    font-family:Inter;
    background:#0b1220;
    color:#e5e7eb;
}

/* CENTER CONTAINER */
.wrapper{
    max-width:700px;
    margin:60px auto;
    padding:20px;
}

/* CARD */
.card{
    background:#111827;
    border:1px solid #1f2937;
    border-radius:14px;
    padding:30px;
    box-shadow:0 10px 30px rgba(0,0,0,0.3);
}

/* TITLE */
h1{
    margin:0 0 5px;
    font-size:22px;
}

.sub{
    color:#94a3b8;
    font-size:13px;
    margin-bottom:25px;
}

/* INPUT GROUP */
.group{
    margin-bottom:18px;
}

label{
    display:block;
    font-size:13px;
    margin-bottom:6px;
    color:#cbd5e1;
}

/* INPUT STYLE */
input{
    width:100%;
    padding:12px 14px;
    border-radius:10px;
    border:1px solid #1f2937;
    background:#0f172a;
    color:white;
    outline:none;
    transition:0.2s;
}

input:focus{
    border-color:#3b82f6;
    box-shadow:0 0 0 3px rgba(59,130,246,0.2);
}

/* OPTIONS STYLE (IMPORTANT PART) */
.option-box{
    display:flex;
    align-items:center;
    gap:10px;
    background:#0f172a;
    border:1px solid #1f2937;
    padding:10px 12px;
    border-radius:10px;
    margin-bottom:10px;
}

.option-label{
    font-weight:600;
    width:30px;
    color:#60a5fa;
}

/* CORRECT INPUT SPECIAL */
.correct{
    border:1px solid #22c55e;
}

/* BUTTON */
button{
    width:100%;
    padding:13px;
    border:none;
    border-radius:10px;
    background:linear-gradient(135deg,#3b82f6,#2563eb);
    color:white;
    font-weight:600;
    cursor:pointer;
    margin-top:10px;
    transition:0.2s;
}

button:hover{
    transform:translateY(-1px);
    box-shadow:0 10px 20px rgba(59,130,246,0.3);
}

/* SMALL HELP TEXT */
.hint{
    font-size:12px;
    color:#64748b;
    margin-top:4px;
}

.back {
    display: block;
    text-align: center;
    margin-top: 20px;

    font-size: 14px;
    font-weight: 600;

    color: var(--dark);
    text-decoration: none;
}

.back:hover {
    color: var(--muted);
}

</style>

</head>

<body>

<div class="wrapper">

    <div class="card">

        <h1>Add New Question</h1>
        <div class="sub">Create structured quiz question for users</div>

        <form method="POST" action="/add_question/{{ quiz_id }}">

            <!-- QUESTION -->
            <div class="group">
                <label>Question</label>
                <input type="text" name="question" placeholder="Enter your question..." required>
                <div class="hint">Make it clear and simple</div>
            </div>

            <!-- OPTION A -->
            <div class="group">
                <label>Option A</label>
                <div class="option-box">
                    <span class="option-label">A</span>
                    <input type="text" name="a" placeholder="First option..." required>
                </div>
            </div>

            <!-- OPTION B -->
            <div class="group">
                <label>Option B</label>
                <div class="option-box">
                    <span class="option-label">B</span>
                    <input type="text" name="b" placeholder="Second option..." required>
                </div>
            </div>

            <!-- OPTION C -->
            <div class="group">
                <label>Option C</label>
                <div class="option-box">
                    <span class="option-label">C</span>
                    <input type="text" name="c" placeholder="Third option..." required>
                </div>
            </div>

            <!-- OPTION D -->
            <div class="group">
                <label>Option D</label>
                <div class="option-box">
                    <span class="option-label">D</span>
                    <input type="text" name="d" placeholder="Fourth option..." required>
                </div>
            </div>

            <!-- CORRECT -->
            <div class="group">
                <label>Correct Answer</label>
                <input class="correct" type="text" name="correct"
                       placeholder="Enter correct option (a / b / c / d)" required>
                <div class="hint">Only one correct answer allowed</div>
            </div>

            <button type="submit">Add Question</button>

        </form>

    </div>

    <a href="/admin_dashboard" class="back">← Back to Dashboard</a>

</div>

</body>
</html>
