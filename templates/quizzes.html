<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Available Assessments</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root{
    --bg:#0b1220;
    --card:#111827;
    --border:#1f2937;
    --text:#e5e7eb;
    --muted:#94a3b8;
    --primary:#3b82f6;
    --primary-hover:#2563eb;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Inter;
}

body{
    background:var(--bg);
    color:var(--text);
}

/* HEADER */
.header{
    padding:30px 40px;
}

.header h1{
    font-size:22px;
}

.header p{
    font-size:13px;
    color:var(--muted);
    margin-top:5px;
}

/* GRID */
.container{
    padding:0 40px 40px;
}

.grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:18px;
}

/* CARD */
.card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:14px;
    padding:18px;
    height:160px;

    display:flex;
    flex-direction:column;
    justify-content:space-between;

    transition:0.2s;
}

.card:hover{
    transform:translateY(-3px);
    border-color:#2b3b55;
}

/* TITLE */
.title{
    font-size:16px;
    font-weight:600;
}

/* META */
.meta{
    font-size:12px;
    color:var(--muted);
}

/* BUTTON */
.btn{
    display:inline-block;
    padding:8px 12px;
    border-radius:8px;
    background:var(--primary);
    color:white;
    text-decoration:none;
    font-size:12px;
    font-weight:500;
    text-align:center;
}

.btn:hover{
    background:var(--primary-hover);
}

/* EMPTY */
.empty{
    text-align:center;
    margin-top:60px;
    color:var(--muted);
}
</style>
</head>

<body>

<div class="header">
    <h1>Available Assessments</h1>
    <p>Select a quiz and start your test</p>
</div>

<div class="container">

    {% if quizzes %}

    <div class="grid">

        {% for q in quizzes %}
        <div class="card">

            <div>
                <div class="title">{{ q[1] }}</div>
                <div class="meta">Quiz ID: {{ q[0] }}</div>
            </div>

            <a class="btn" href="/take_quiz/{{ q[0] }}">
                Start Assessment →
            </a>

        </div>
        {% endfor %}

    </div>

    {% else %}

    <div class="empty">
        No assessments available right now.
    </div>

    {% endif %}

</div>

</body>
</html>
