<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Company Register&Login</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="../static/css/company.css">
</head>

<body>

<div class="container d-flex justify-content-center align-items-center vh-100">

    <div class="auth-card row">

        <!-- LEFT IMAGE -->
        <div class="col-lg-6 d-none d-lg-flex align-items-center justify-content-center image-side">
            <img id="authImage"   src="../static/images/login.jpg" class="img-fluid">
        </div>

        <!-- RIGHT FORM -->
        <div class="col-lg-6 d-flex align-items-center justify-content-center">

            <div class="form-box">

                <!-- LOGIN FORM -->
                <div id="loginForm">
                    <h3>Login</h3>
                    <p>Access your company dashboard</p>

                    <form action="/company_login" method="POST">
                        <input type="text" name="Cemail" class="form-control mb-3" placeholder="Company Email">
                        <input type="password" name="password" class="form-control mb-3" placeholder="Password">

                        <div class="d-flex justify-content-between mb-3 small">
                            <div>
                                <input type="checkbox"> Remember me
                            </div>
                            <a href="#">Forgot?</a>
                        </div>

                        <button class="btn btn-main w-100">Login</button>

                        <div class="text-center mt-3">
                            <small>
                                Don't have an account ?
                                <a href="#" onclick="showRegister()">Sign Up</a>
                            </small>
                        </div>
                    </form>
                </div>

                <!-- REGISTER FORM -->
                <div id="registerForm" style="display:none;">
                    <h3>Register</h3>
                    <p>Create your company profile</p>

                    <form action="/company_register" method="POST">
                        <input type="text" name="Cname" class="form-control mb-3" placeholder="Company Name">
                        <input type="email" name="Cemail" class="form-control mb-3" placeholder="company Email">
                        <input type="text" name="website" class="form-control mb-3" placeholder="Website">
                        <input type="text" name="location" class="form-control mb-3" placeholder="Location">
                        <input type="password" name="password" class="form-control mb-3" placeholder="Password">

                        <div class="mb-3 small">
                            <input type="checkbox"> I agree to Terms & Policy
                        </div>

                        <button class="btn btn-main w-100">Sign Up</button>

                        <div class="text-center mt-3">
                            <small>
                                Already have an account ?
                                <a href="#" onclick="showLogin()">Sign In</a>
                            </small>
                        </div>
                    </form>
                </div>

            </div>

        </div>

    </div>

</div>

<script src="../static/js/company.js"></script>

</body>
</html>
