<!DOCTYPE html>
<html>
<head>
<title>Create Quiz</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">

<style>
body{
    margin:0;
    font-family:Inter;
    background:#0f172a;
    color:white;
}

.container{
    max-width:700px;
    margin:80px auto;
    background:#111827;
    padding:30px;
    border-radius:12px;
    border:1px solid #1f2937;
}

h2{
    margin-bottom:20px;
}

input{
    width:100%;
    padding:12px;
    margin:10px 0;
    border-radius:8px;
    border:none;
    background:#1f2937;
    color:white;
}

button{
    width:100%;
    padding:12px;
    background:#3b82f6;
    color:white;
    border:none;
    border-radius:8px;
    cursor:pointer;
}

button:hover{
    background:#2563eb;
}

.back {
    display: block;
    text-align: center;
    margin-top: 20px;

    font-size: 14px;
    font-weight: 600;

    color: var(--dark);
    text-decoration: none;
}

.back:hover {
    color: var(--muted);
}
</style>
</head>

<body>

<div class="container">
    <h2>Create New Quiz</h2>

    <form method="POST">

        <input type="text" name="title" placeholder="Quiz Title" required>

        <button type="submit">Create Quiz</button>
    </form>

</div>
<a href="/admin_dashboard" class="back">← Back to Dashboard</a>

</body>
</html>
