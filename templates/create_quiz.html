<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Create Quiz</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: Inter, sans-serif; }
        body { background: #0b1220; color: #e5e7eb; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }

        .card {
            background: #111827;
            border: 1px solid #1f2937;
            border-radius: 16px;
            padding: 36px;
            width: 100%;
            max-width: 520px;
        }

        h1 { font-size: 20px; font-weight: 700; margin-bottom: 6px; }
        .sub { font-size: 13px; color: #64748b; margin-bottom: 28px; }

        .field { margin-bottom: 20px; }

        label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: #94a3b8;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        input[type="text"] {
            width: 100%;
            padding: 11px 14px;
            background: #0b1220;
            border: 1px solid #1f2937;
            border-radius: 10px;
            color: #fff;
            font-size: 14px;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: #3b82f6;
        }

        .hint {
            font-size: 12px;
            color: #4b5563;
            margin-top: 6px;
            line-height: 1.5;
        }

        .hint code {
            background: #1f2937;
            padding: 1px 6px;
            border-radius: 4px;
            color: #67e8f9;
            font-size: 11px;
        }

        /* TAG PREVIEW */
        .tag-preview {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            min-height: 28px;
            margin-top: 10px;
        }

        .tag-chip {
            background: rgba(59,130,246,0.12);
            border: 1px solid rgba(59,130,246,0.3);
            color: #93c5fd;
            padding: 3px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
        }

        button[type="submit"] {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #3b82f6, #6366f1);
            border: none;
            border-radius: 10px;
            color: white;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 8px;
            transition: opacity 0.2s;
        }

        button[type="submit"]:hover { opacity: 0.9; }

        .back {
            display: block;
            text-align: center;
            margin-top: 18px;
            color: #4b5563;
            font-size: 13px;
            text-decoration: none;
        }
        .back:hover { color: #e5e7eb; }
    </style>
</head>
<body>

<div class="card">
    <h1>Create New Quiz</h1>
    <p class="sub">Add a title and tags so the recommendation engine can match it to careers.</p>

    <form method="POST">

        <div class="field">
            <label>Quiz Title</label>
            <input type="text" name="title" placeholder="e.g. Python Fundamentals" required>
        </div>

        <div class="field">
            <label>Tags <span style="color:#4b5563; font-weight:400; text-transform:none">(comma-separated)</span></label>
            <input type="text" name="tags" id="tagsInput"
                   placeholder="e.g. python, programming, backend, data science"
                   oninput="updatePreview(this.value)">
            <div class="hint">
                Tags link this quiz to careers. Use keywords like <code>python</code>, <code>sql</code>, <code>machine learning</code>, <code>frontend</code>
            </div>
            <div class="tag-preview" id="tagPreview"></div>
        </div>

        <button type="submit">Create Quiz & Add Questions →</button>
    </form>

    <a href="/admin_dashboard" class="back">← Back to Dashboard</a>
</div>

<script>
function updatePreview(val) {
    const preview = document.getElementById('tagPreview');
    const tags = val.split(',').map(t => t.trim()).filter(t => t.length > 0);
    preview.innerHTML = tags.map(t => `<span class="tag-chip">${t}</span>`).join('');
}
</script>

</body>
</html>
