<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            margin: 0;
            font-family: Inter;
            background: #0f172a;
            color: white;
        }

        /* SIDEBAR */
        .sidebar {
            position: fixed;
            width: 240px;
            height: 100vh;
            background: #111827;
            padding: 20px;
        }

        .logo {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 30px;
            color: #60a5fa;
        }

        .nav a {
            display: block;
            padding: 12px;
            margin: 6px 0;
            color: #cbd5e1;
            text-decoration: none;
            border-radius: 8px;
        }

        .nav a:hover {
            background: #1f2937;
            color: white;
        }

        /* MAIN */
        .main {
            margin-left: 260px;
            padding: 30px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-top: 20px;
        }

        .card {
            background: #111827;
            padding: 20px;
            border-radius: 12px;
            border: 1px solid #1f2937;
        }

        .card h2 {
            margin: 0;
            font-size: 28px;
        }

        .card p {
            color: #94a3b8;
        }

        .btn {
            background: #3b82f6;
            color: white;
            padding: 10px 14px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            text-decoration: none;
        }

        .btn:hover {
            background: #2563eb;
        }

        .section {
            margin-top: 30px;
        }

        .table {
            width: 100%;
            margin-top: 15px;
            border-collapse: collapse;
        }

        .table th,
        .table td {
            padding: 12px;
            border-bottom: 1px solid #1f2937;
            text-align: left;
            color: #cbd5e1;
        }

        .badge {
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 12px;
            background: #1f2937;
        }
    </style>
</head>

<body>

    <!-- SIDEBAR -->
    <div class="sidebar">
        <div class="logo">TalentFlow Admin</div>

        <div class="nav">
            <a href="/admin_dashboard">Dashboard</a>
            <a href="/create_quiz">Create Quiz</a>
            <a href="/quiz_list">Add Questions</a>
            <a href="/quiz_list">Manage Quizzes</a>
            <a href="/view_results">Results</a>
            <a href="/logout">Logout</a>
        </div>
    </div>

    <!-- MAIN -->
    <div class="main">

        <div class="header">
            <h1>Admin Dashboard</h1>
            <a href="/create_quiz" class="btn">+ Create Quiz</a>
        </div>
        <h2>Welcome, {{ admin_name }}</h2>

        <!-- STATS -->
        <div class="cards">
            <div class="card">
                <h2>{{ users }}</h2>
                <p>Total Users</p>
            </div>

            <div class="card">
                <h2>{{ attempts }}</h2>
                <p>Total Quiz Attempts</p>
            </div>

            <div class="card">
                <h2>{{ active_users }}</h2>
                <p>System Status</p>
            </div>
        </div>

        <!-- QUICK ACTION -->
        <div class="section">
            <h2>Quick Actions</h2>

            <a href="/create_quiz" class="btn">Create New Quiz</a>
            <a href="/quiz_results" class="btn">View Results</a>
        </div>

    </div>

</body>

</html>
